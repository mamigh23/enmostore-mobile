name: Phase 2 Format Once

on:
  push:
    branches: [work]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v5
        with:
          ref: work

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.19.4'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format Phase 2 baseline
        run: |
          npx prettier --write \
            __tests__/apiClient.test.ts \
            __tests__/environment.test.ts \
            __tests__/localization.test.ts \
            .eslintrc.js \
            .prettierrc \
            app.json \
            ARCHITECTURE.md \
            babel.config.js \
            DESIGN_SYSTEM.md \
            index.js \
            jest.config.js \
            metro.config.js \
            README.md \
            src/app/App.tsx \
            src/config/environment.ts \
            src/core/localization/LocaleProvider.tsx \
            src/core/localization/translations.ts \
            src/core/network/ApiClient.ts \
            src/core/storage/tokenStore.ts \
            src/design/tokens.ts \
            src/domain/Session.ts \
            src/features/AccountScreen.tsx \
            src/features/auth/AuthRepository.ts \
            src/features/CartScreen.tsx \
            src/features/ExploreScreen.tsx \
            src/features/FavoritesScreen.tsx \
            src/features/HomeScreen.tsx \
            src/features/SearchScreen.tsx \
            src/navigation/MainTabs.tsx \
            src/shared/PrimaryButton.tsx \
            src/shared/Screen.tsx \
            tsconfig.json

      - name: Commit normalized formatting
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            __tests__/apiClient.test.ts \
            __tests__/environment.test.ts \
            __tests__/localization.test.ts \
            .eslintrc.js \
            .prettierrc \
            app.json \
            ARCHITECTURE.md \
            babel.config.js \
            DESIGN_SYSTEM.md \
            index.js \
            jest.config.js \
            metro.config.js \
            README.md \
            src/app/App.tsx \
            src/config/environment.ts \
            src/core/localization/LocaleProvider.tsx \
            src/core/localization/translations.ts \
            src/core/network/ApiClient.ts \
            src/core/storage/tokenStore.ts \
            src/design/tokens.ts \
            src/domain/Session.ts \
            src/features/AccountScreen.tsx \
            src/features/auth/AuthRepository.ts \
            src/features/CartScreen.tsx \
            src/features/ExploreScreen.tsx \
            src/features/FavoritesScreen.tsx \
            src/features/HomeScreen.tsx \
            src/features/SearchScreen.tsx \
            src/navigation/MainTabs.tsx \
            src/shared/PrimaryButton.tsx \
            src/shared/Screen.tsx \
            tsconfig.json

          if git diff --cached --quiet; then
            echo 'Formatting is already normalized.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: normalize Phase 2 formatting'
          git push origin HEAD:work
