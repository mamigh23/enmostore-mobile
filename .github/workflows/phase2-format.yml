name: Phase 2 one-time format

on:
  push:
    branches: [phase2-hardening]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: npm install
      - run: npm run format
      - name: Commit formatting and lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style: format Phase 2 foundation and lock dependencies [formatted]"
          git push origin HEAD:phase2-hardening
